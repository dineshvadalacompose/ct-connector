deployAs:
  # NOTE: /event has no authentication (no shared secret, no Pub/Sub OIDC token check) - anyone
  # who discovers its public URL can post a fake notification. Acceptable while this app only
  # logs what it receives; revisit before it triggers any real side effect. See event/README.md.
  - name: event
    applicationType: event
    endpoint: /event
    scripts:
      postDeploy: npm ci && npm run connector:post-deploy
      preUndeploy: npm ci && npm run connector:pre-undeploy
    configuration:
      standardConfiguration:
        - key: CTP_PROJECT_KEY
          description: Project key of the commercetools Composable Commerce Project
          required: true
        - key: CTP_AUTH_URL
          description: Authentication URL of the commercetools Composable Commerce Project
          required: true
        - key: CTP_API_URL
          description: API URL of the commercetools Composable Commerce Project
          required: true
        - key: CTP_SCOPES
          description: Space-separated scopes of an API Client (needs manage_subscriptions)
          required: true
        - key: QSTASH_DESTINATION_URL
          description: The URL QStash delivers forwarded events to - the /api/receive endpoint of the separate qstash-receiver proof app (github.com/dineshvadalacompose/qstash-receiver), e.g. https://qstash-receiver-phi.vercel.app/api/receive.
          required: true
      securedConfiguration:
        - key: CTP_CLIENT_ID
          description: client_id of an API Client
          required: true
        - key: CTP_CLIENT_SECRET
          description: secret of an API Client
          required: true
        - key: QSTASH_TOKEN
          description: Bearer token for Upstash QStash, used to forward decoded events for reliable delivery.
          required: true

  - name: console
    applicationType: merchant-center-custom-application
    configuration:
      standardConfiguration:
        - key: CUSTOM_APPLICATION_ID
          description: The registered Custom Application's ID from Merchant Center (Organization > Custom Applications).
          required: true
        - key: ENTRY_POINT_URI_PATH
          description: Must match the entry point path registered for this Custom Application in Merchant Center (event-relay-console) - this value cannot be changed after registration.
          required: true
        - key: CLOUD_IDENTIFIER
          description: The Merchant Center cloud/region short code this project's Custom Applications run in (e.g. gcp-au for Australia/GCP). Required by Connect's own connector-specification validation for this application type - a deploy is rejected outright if this is missing.
          required: true
